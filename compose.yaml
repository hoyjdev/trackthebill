services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

  go-api:
    build: ./api
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  caddy_data:
