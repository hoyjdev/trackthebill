services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENSTATES_API_KEY=${OPENSTATES_API_KEY}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://api:8080
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - api

volumes:
  caddy_data:
